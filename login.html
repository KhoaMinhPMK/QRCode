<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Hệ thống QR Khối</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <i class="fas fa-qrcode logo-icon"></i>
                <h1>WebQR Manager</h1>
                <p class="login-subtitle">Đăng nhập để quản lý mã QR</p>
            </div>
            
            <div class="login-form">
                <div class="form-group">
                    <label for="username">Tên đăng nhập</label>
                    <div class="input-with-icon">
                        <i class="fas fa-user"></i>
                        <input type="text" id="username" placeholder="Nhập tên đăng nhập" autocomplete="username">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="password">Mật khẩu</label>
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" placeholder="Nhập mật khẩu" autocomplete="current-password">
                    </div>
                </div>
                
                <div id="loginError" class="login-error hidden"></div>
                
                <button id="loginBtn" class="btn primary-btn">
                    <i class="fas fa-sign-in-alt"></i> Đăng nhập
                </button>
            </div>
            
            <div class="login-footer">
                <p>&copy; 2023 WebQR Manager</p>
            </div>
        </div>
    </div>
    
    <div id="notificationContainer" class="notification-container"></div>
    
    <script src="utils/auth.js" type="module"></script>
    <script src="login.js" type="module"></script>
</body>
</html>
